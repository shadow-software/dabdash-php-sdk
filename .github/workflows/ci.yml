# Push/PR gate — autoload + smoke tests on the committed generated client.
#
# Public repo: always GitHub-hosted (ubuntu-latest). Do NOT set CI_RUNNER.
name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          tools: composer:v2

      - run: composer install --prefer-dist --no-interaction --no-progress
      - run: composer test
