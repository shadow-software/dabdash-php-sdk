# Copy into a PUBLIC SDK repo as .github/workflows/lockdown.yml.
# Source-available, not contribution-seeking: auto-close every PR.
name: Lockdown

on:
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions:
  pull-requests: write

jobs:
  close:
    name: Close external pull requests
    runs-on: ubuntu-latest
    steps:
      - name: Close and comment
        uses: actions/github-script@v7
        with:
          script: |
            const body = [
              'Thanks for the interest — this repository is **source-available**, not open for contributions.',
              '',
              'Pull requests are not accepted. Please open an **issue** if you have found a bug',
              'or need a change; maintainers will handle it from there.',
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              state: 'closed',
            });
